# Bring cloudflare/vibesdk main into this fork on a branch and open a pull
# request. This workflow never pushes to main. If sync/upstream-main cannot
# fast-forward, it is left as-is (so an in-progress conflict resolution is
# not overwritten) and a new sync/upstream-<sha> branch carries the update.
#
# Actions are disabled on a new fork until someone enables them. Scheduled
# runs also stay off until then, and they only see the workflow file that is
# on the default branch. In the GitHub UI:
#   1. Actions tab → "I understand my workflows, go ahead and enable them"
#      (this also re-enables scheduled workflows on the fork).
#   2. Settings → Actions → General → Actions permissions →
#      "Allow all actions and reusable workflows".
#   3. Settings → Actions → General → Workflow permissions →
#      "Read and write permissions", and check
#      "Allow GitHub Actions to create and approve pull requests".
#   4. If the eleia-llc organization restricts Actions, an org owner must
#      allow them for this repository (Organization settings → Actions).
# Issues are disabled on this fork. Conflicts stay on the sync pull request;
# this workflow does not open issues.

name: Sync upstream

on:
  schedule:
    # Monday 06:17 UTC. Offset from the hour to avoid schedule stampedes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  open-sync-pr:
    name: Open upstream sync PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or update the sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/cloudflare/vibesdk.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin main

          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          SHORT="$(git rev-parse --short=12 upstream/main)"
          MIRROR_BRANCH="sync/upstream-main"

          open_pr_number() {
            gh pr list --base main --head "${GITHUB_REPOSITORY%%/*}:$1" --state open --json number --jq '.[0].number // empty'
          }

          if git merge-base --is-ancestor "$UPSTREAM_SHA" origin/main; then
            echo "origin/main already contains upstream/main (${UPSTREAM_SHA})."
            existing="$(open_pr_number "$MIRROR_BRANCH")"
            if [ -n "$existing" ]; then
              gh pr close "$existing" --comment "upstream/main ya está contenido en main de este fork. Este PR de sincronización se cierra sin cambios."
            fi
            exit 0
          fi

          publish() {
            git push origin "${UPSTREAM_SHA}:refs/heads/${1}"
          }

          branch="$MIRROR_BRANCH"
          if ! publish "$branch"; then
            echo "Refusing to force-push ${MIRROR_BRANCH}. Publishing sync/upstream-${SHORT} instead."
            branch="sync/upstream-${SHORT}"
            publish "$branch"
          fi

          body_file="$(mktemp)"
          {
            echo "## Resumen"
            echo
            echo "Trae \`main\` de [cloudflare/vibesdk](https://github.com/cloudflare/vibesdk) (\`${SHORT}\`) a este fork."
            echo
            echo "El workflow solo publica la rama \`${branch}\` y abre este PR. No hace push a \`main\`. Si hay conflictos, se resuelven en este PR; \`main\` sigue intacto."
            echo
            echo "## Notas"
            echo
            echo "- Si \`sync/upstream-main\` no puede avanzar en fast-forward (por ejemplo, porque alguien ya empezó a resolver conflictos ahí), el workflow no la reescribe. Publica \`sync/upstream-<sha>\` y deja la rama anterior como está."
            echo "- No mezclar este PR mientras GitHub reporte conflictos."
          } > "$body_file"

          title="chore: sincronizar con cloudflare/vibesdk main"
          existing="$(open_pr_number "$branch")"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$body_file"
            echo "Updated pull request #${existing}."
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file "$body_file"
          fi
